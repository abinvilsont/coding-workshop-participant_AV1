<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f4fd8" />
    <meta name="description" content="Report, track and resolve facility and workplace technology incidents." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACME Facility Desk</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved light/dark choice before React loads, so the page doesn't flash.
      // Same storage key and <html> class as MUI's colour-scheme switch (src/theme.js).
      try {
        var mode = localStorage.getItem('mui-mode') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
